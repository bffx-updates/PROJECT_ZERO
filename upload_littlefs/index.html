<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0c">
<title>BFMIDI · Atualizar Firmware</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #14141a;
    --hair: #2a2a32;
    --text: #e6e6ee;
    --muted: #9c9ca6;
    --accent: #ffd060;
    --success: #30d158;
    --danger: #ff6b6b;
    --font-mono: ui-monospace, 'JetBrains Mono', Menlo, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% -20%, #1f1f28 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 18px;
    padding: 36px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.16em;
    margin: 0 0 6px;
    color: var(--accent);
  }
  .subtitle {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 28px;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hair);
    border-radius: 10px;
    margin-bottom: 14px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .field input { accent-color: var(--accent); }
  .field-label { color: var(--text); }
  .field-hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
  }
  button.primary {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #0a0a0c;
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    font-weight: 700;
    padding: 16px;
    border-radius: 10px;
    width: 100%;
    cursor: pointer;
    transition: filter 0.15s, transform 0.05s;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary.is-error   { background: var(--danger); color: #fff; }
  button.primary.is-success { background: var(--success); color: #0a0a0c; }
  button.secondary {
    appearance: none;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--hair);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }
  button.secondary:hover { color: var(--text); border-color: #4c4c55; }
  .status {
    margin-top: 18px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    min-height: 38px;
  }
  .status.is-progress { color: var(--accent); }
  .status.is-error    { color: var(--danger); }
  .status.is-success  { color: var(--success); }
  .progress-bar {
    height: 4px;
    background: var(--hair);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s linear;
  }
  .log {
    margin-top: 14px;
    background: #050507;
    border: 1px solid var(--hair);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    display: none;
  }
  .log.is-visible { display: block; }
  .footer {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>BFMIDI · UPDATE</h1>
    <p class="subtitle">Atualização via cabo USB</p>

    <label class="field">
      <input type="checkbox" id="flash-firmware" checked>
      <span class="field-label">Atualizar firmware</span>
      <span class="field-hint" id="firmware-size">—</span>
    </label>

    <label class="field">
      <input type="checkbox" id="flash-littlefs" checked>
      <span class="field-label">Atualizar webApp (LittleFS)</span>
      <span class="field-hint" id="littlefs-size">—</span>
    </label>

    <button id="action" class="primary">Conectar dispositivo</button>
    <button id="erase" class="secondary" style="display:none">Apagar memória completa</button>
    <button id="toggle-log" class="secondary">Mostrar logs de debug</button>

    <div id="status" class="status">Aguardando conexão...</div>
    <div class="progress-bar"><span id="progress"></span></div>

    <pre id="log" class="log"></pre>

    <p class="footer">
      ESP32-S2 · 115200 baud · Funciona em Chrome/Edge (PC, Mac, Android)
    </p>
  </div>

<script type="module">
import { ESPLoader, Transport } from './esptool-bundle.js';

// ── Imagens da flash ─────────────────────────────────────────────────
// Offsets vem do partitions.csv do firmware:
//   0x1000   bootloader
//   0x8000   partition-table
//   0x10000  app (firmware)
//   0x280000 storage (LittleFS, 1.5 MB)
const IMAGES = {
  bootloader: { path: './bootloader.bin',      address: 0x1000 },
  partitions: { path: './partition-table.bin', address: 0x8000 },
  firmware:   { path: './firmware.bin',        address: 0x10000 },
  littlefs:   { path: './littlefs.bin',        address: 0x280000 },
};

// ── Filtros USB ─────────────────────────────────────────────────────
// Multiplas combinacoes pra cobrir:
//   - 0x80c2: ESP32-S2 rodando firmware com TinyUSB CDC (BFMiDi)
//   - 0x0002: ESP32-S2 ROM bootloader (download mode)
//   - VID-only fallback (libera qualquer placa Espressif)
const USB_FILTERS = [
  { usbVendorId: 0x303a, usbProductId: 0x80c2 },
  { usbVendorId: 0x303a, usbProductId: 0x0002 },
  { usbVendorId: 0x303a },
];

// ── State ────────────────────────────────────────────────────────────
const state = {
  port: null,
  transport: null,
  loader: null,
  lastPortInfo: null,
  step: 'idle', // idle | awaiting_port | connected | flashing | done | error
};

// ── UI helpers ───────────────────────────────────────────────────────
const $action       = document.getElementById('action');
const $erase        = document.getElementById('erase');
const $toggleLog    = document.getElementById('toggle-log');
const $status       = document.getElementById('status');
const $progress     = document.getElementById('progress');
const $log          = document.getElementById('log');
const $flashFw      = document.getElementById('flash-firmware');
const $flashFs      = document.getElementById('flash-littlefs');
const $firmwareSize = document.getElementById('firmware-size');
const $littlefsSize = document.getElementById('littlefs-size');

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function setStatus(msg, variant = '') {
  $status.textContent = msg;
  $status.className = 'status' + (variant ? ' is-' + variant : '');
}
function setActionLabel(label, variant = '') {
  $action.textContent = label;
  $action.className = 'primary' + (variant ? ' is-' + variant : '');
}
function log(msg) {
  const ts = new Date().toLocaleTimeString();
  $log.textContent += `[${ts}] ${msg}\n`;
  $log.scrollTop = $log.scrollHeight;
  console.log(msg);
}
function setProgress(pct) {
  $progress.style.width = Math.max(0, Math.min(100, pct)) + '%';
}
function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

// ── Probe sizes (HEAD requests) ─────────────────────────────────────
async function probeSizes() {
  for (const [key, img] of Object.entries(IMAGES)) {
    try {
      const r = await fetch(img.path, { method: 'HEAD' });
      if (!r.ok) { img.missing = true; continue; }
      img.size = parseInt(r.headers.get('Content-Length') || '0', 10);
      if (key === 'firmware') $firmwareSize.textContent = formatBytes(img.size);
      if (key === 'littlefs') $littlefsSize.textContent = formatBytes(img.size);
    } catch { img.missing = true; }
  }
  if (IMAGES.firmware.missing) {
    $firmwareSize.textContent = 'arquivo ausente';
    $flashFw.checked = false; $flashFw.disabled = true;
  }
  if (IMAGES.littlefs.missing) {
    $littlefsSize.textContent = 'arquivo ausente';
    $flashFs.checked = false; $flashFs.disabled = true;
  }
}

// ── Wrappers de signals — engole erros do setDTR/setRTS ──────────────
// ESP32-S2/S3 com USB CDC nativo nao tem linhas de controle reais; o
// setSignals do navegador pode retornar erro mesmo funcionando. Sem o
// wrap, qualquer erro aborta o fluxo.
function wrapSignals(t) {
  const wrap = (fn) => async (val) => {
    try { return await fn.call(t, val); }
    catch (err) { log('Signal warning: ' + err.message); }
  };
  if (t?.setDTR) t.setDTR = wrap(t.setDTR);
  if (t?.setRTS) t.setRTS = wrap(t.setRTS);
  return t;
}

async function closeTransportSafe(t) {
  if (!t) return;
  try { await t.disconnect(); } catch {}
  try { await t.waitForUnlock?.(200); } catch {}
}

// ── Pulso DTR/RTS pra colocar ESP32-S2 em modo download ──────────────
// EN=RTS (reset), GPIO0=DTR (boot mode).
async function pulseBootMode(t) {
  log('Enviando pulso boot/reset...');
  await t.setRTS?.(true);  // EN low (reset)
  await t.setDTR?.(true);  // GPIO0 low (boot mode)
  await sleep(100);
  await t.setRTS?.(false); // EN high (sai do reset)
  await sleep(50);
  await t.setDTR?.(false); // GPIO0 high
  await sleep(50);
  log('Pulso enviado.');
}

// ── Reconecta apos re-enumeracao USB ────────────────────────────────
async function waitForReconnect(timeoutMs = 15000) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    const ports = await navigator.serial.getPorts();
    const match = ports.find(p => {
      const info = p.getInfo();
      return info.usbVendorId === state.lastPortInfo?.usbVendorId;
    });
    if (match) {
      state.port = match;
      const info = match.getInfo();
      state.lastPortInfo = { usbVendorId: info.usbVendorId, usbProductId: info.usbProductId };
      log(`Reconectado: VID=0x${info.usbVendorId.toString(16)} PID=0x${info.usbProductId.toString(16)}`);
      return match;
    }
    await sleep(250);
  }
  throw new Error('Timeout aguardando reconexao do dispositivo.');
}

// ── Acquire port (auto-detect primeiro, dialogo depois) ──────────────
async function acquirePort() {
  if (!('serial' in navigator)) {
    throw new Error('Navegador incompativel. Use Chrome ou Edge no PC/Mac/Android.');
  }

  // Tenta dispositivo ja autorizado
  try {
    const ports = await navigator.serial.getPorts();
    const match = ports.find(p => {
      const info = p.getInfo();
      return USB_FILTERS.some(f =>
        f.usbVendorId === info.usbVendorId &&
        (!f.usbProductId || f.usbProductId === info.usbProductId)
      );
    });
    if (match) {
      state.port = match;
      const info = match.getInfo();
      state.lastPortInfo = { usbVendorId: info.usbVendorId, usbProductId: info.usbProductId };
      log(`Dispositivo ja autorizado: VID=0x${info.usbVendorId.toString(16)} PID=0x${info.usbProductId.toString(16)}`);
      return match;
    }
  } catch (e) {
    log('Auto-detect falhou: ' + e.message);
  }

  // Dialogo
  log('Solicitando porta serial...');
  const filters = state.lastPortInfo
    ? [{ usbVendorId: state.lastPortInfo.usbVendorId }]
    : USB_FILTERS;
  try {
    state.port = await navigator.serial.requestPort({ filters });
    const info = state.port.getInfo();
    state.lastPortInfo = { usbVendorId: info.usbVendorId, usbProductId: info.usbProductId };
    return state.port;
  } catch (err) {
    if (err.name === 'NotFoundError') return null; // user cancelled
    throw err;
  }
}

// ── Esp-loader terminal sink ────────────────────────────────────────
const espTerminal = {
  clean() {},
  writeLine(s) { log(s); },
  write(s)     { log(s); },
};

// ── ArrayBuffer -> string binaria (esptool-js espera assim) ──────────
async function fetchBinaryString(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error('Arquivo nao encontrado: ' + path);
  const buf = new Uint8Array(await r.arrayBuffer());
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  }
  return s;
}

// ── Conectar (pulso boot + ESPLoader.main) ──────────────────────────
async function handleConnect() {
  try {
    state.step = 'awaiting_port';
    setStatus('Selecione a porta do BFMIDI...', 'progress');
    setActionLabel('Autorizar conexao');

    const dev = await acquirePort();
    if (!dev) {
      setStatus('Nenhuma porta selecionada.', '');
      setActionLabel('Conectar dispositivo');
      state.step = 'idle';
      return;
    }

    $action.disabled = true;
    setStatus('Preparando dispositivo...', 'progress');
    await sleep(300);

    const isBootloader = state.lastPortInfo?.usbProductId === 0x0002;

    // Se nao esta em bootloader, manda pulso pra entrar em modo download.
    if (!isBootloader) {
      let pre = null;
      try {
        pre = wrapSignals(new Transport(state.port, true));
        await pre.connect(115200);
        await pulseBootMode(pre);
      } catch (e) {
        log('Aviso no pulso boot: ' + e.message);
      } finally {
        await closeTransportSafe(pre);
      }

      setStatus('Reiniciando em modo download...', 'progress');
      log('Aguardando re-enumeracao USB...');
      await sleep(2000);

      // ESP32-S2 muda de PID ao entrar no bootloader — browser ve como
      // dispositivo novo. Tenta reconectar rapido (3s); se nao achar,
      // pede o usuario re-autorizar.
      try {
        await waitForReconnect(3000);
      } catch {
        log('Bootloader em PID novo — pedindo autorizacao novamente');
        state.port = null;
        state.lastPortInfo = null;
      }
    }

    if (!state.port) {
      setStatus('Clique para confirmar a nova porta...', 'progress');
      setActionLabel('Autorizar conexao');
      $action.disabled = false;
      state.step = 'awaiting_port';
      return;
    }

    log('Aguardando estabilizacao da porta...');
    await sleep(1000);

    // Retry com ate 3 tentativas (alguns chips dao "invalid response" na 1a)
    const MAX_RETRIES = 3;
    let connected = false;
    let lastError = null;

    for (let attempt = 1; attempt <= MAX_RETRIES && !connected; attempt++) {
      try {
        log(`Tentativa ${attempt}/${MAX_RETRIES}...`);
        await closeTransportSafe(state.transport);
        state.transport = wrapSignals(new Transport(state.port, true));
        state.loader = new ESPLoader({
          transport: state.transport,
          baudrate: 115200,
          romBaudrate: 115200,
          terminal: espTerminal,
        });
        await state.loader.main('no_reset');
        connected = true;
        log('Conexao estabelecida!');
      } catch (err) {
        lastError = err;
        log(`Tentativa ${attempt} falhou: ${err.message}`);
        await closeTransportSafe(state.transport);
        state.transport = null;
        state.loader = null;
        if (attempt < MAX_RETRIES) await sleep(1000 * attempt);
      }
    }

    if (!connected) throw lastError || new Error('Falha apos retries');

    state.step = 'connected';
    setStatus('Dispositivo pronto. Clique pra atualizar.', '');
    setActionLabel('Iniciar atualizacao');
    $action.disabled = false;
    $erase.style.display = 'block';

  } catch (e) {
    log('Erro: ' + e.message);
    setStatus('Falha: ' + e.message, 'error');
    setActionLabel('Tentar novamente', 'error');
    state.step = 'error';
    $action.disabled = false;
    await closeTransportSafe(state.transport);
    state.transport = null;
    state.loader = null;
  }
}

// ── Flash ───────────────────────────────────────────────────────────
async function handleFlash() {
  if (!state.loader) return;
  state.step = 'flashing';
  $action.disabled = true;
  $erase.style.display = 'none';
  setProgress(0);

  try {
    const queue = [];
    if ($flashFw.checked) {
      queue.push(IMAGES.bootloader, IMAGES.partitions, IMAGES.firmware);
    }
    if ($flashFs.checked) {
      queue.push(IMAGES.littlefs);
    }
    if (!queue.length) throw new Error('Nada selecionado pra atualizar');

    setStatus('Carregando imagens...', 'progress');
    const fileArray = [];
    for (const img of queue) {
      log(`Carregando ${img.path}...`);
      const data = await fetchBinaryString(img.path);
      fileArray.push({ data, address: img.address });
    }

    setStatus('Gravando flash (nao desconecte o cabo)...', 'progress');
    await state.loader.writeFlash({
      fileArray,
      flashSize: 'keep',
      flashMode: 'keep',
      flashFreq: 'keep',
      eraseAll: false,
      compress: true,
      reportProgress: (idx, written, total) => {
        const pct = Math.floor((written / total) * 100);
        setProgress(pct);
        setStatus(`Gravando arquivo ${idx + 1}/${fileArray.length} (${pct}%)...`, 'progress');
      },
      calculateMD5Hash: (image) => CryptoJS.MD5(CryptoJS.enc.Latin1.parse(image)),
    });

    setStatus('Resetando dispositivo...', 'progress');
    // after() ja faz o hardReset internamente nas versoes novas do
    // esptool-js. O dispositivo desconecta (USB CDC nativo reinicia),
    // entao erros aqui sao esperados — so logamos.
    try { await state.loader.after(); } catch (e) { log('after() warning: ' + e.message); }

    setProgress(100);
    setStatus('Atualizado com sucesso! O BFMIDI vai reiniciar.', 'success');
    setActionLabel('Atualizado com sucesso', 'success');
    state.step = 'done';

  } catch (e) {
    log('Erro: ' + e.message);
    setStatus('Falha: ' + e.message, 'error');
    setActionLabel('Tentar novamente', 'error');
    state.step = 'error';
    $action.disabled = false;
  } finally {
    await closeTransportSafe(state.transport);
    state.transport = null;
    state.loader = null;
  }
}

// ── Erase total ─────────────────────────────────────────────────────
async function handleErase() {
  if (!confirm('Apagar TODA a memoria flash do BFMIDI? Isso remove firmware e presets.')) return;
  $action.disabled = true;
  $erase.disabled = true;
  try {
    setStatus('Apagando flash inteira (~30s)...', 'progress');
    if (state.loader) {
      await state.loader.eraseFlash();
      setStatus('Flash apagada. Faca um update completo agora.', 'success');
    } else {
      throw new Error('Conecte o dispositivo primeiro');
    }
  } catch (e) {
    log('Erro erase: ' + e.message);
    setStatus('Falha ao apagar: ' + e.message, 'error');
  } finally {
    $action.disabled = false;
    $erase.disabled = false;
  }
}

// ── Wire up ─────────────────────────────────────────────────────────
$action.addEventListener('click', () => {
  if (state.step === 'idle' || state.step === 'error' || state.step === 'awaiting_port') {
    handleConnect();
  } else if (state.step === 'connected') {
    handleFlash();
  } else if (state.step === 'done') {
    location.reload();
  }
});

$erase.addEventListener('click', handleErase);

$toggleLog.addEventListener('click', () => {
  const visible = $log.classList.toggle('is-visible');
  $toggleLog.textContent = visible ? 'Ocultar logs de debug' : 'Mostrar logs de debug';
});

// ── Init ────────────────────────────────────────────────────────────
probeSizes();
if (!('serial' in navigator)) {
  setStatus('Web Serial nao suportado. Use Chrome ou Edge no PC/Mac/Android.', 'error');
  $action.disabled = true;
}
</script>

<!-- CryptoJS pra MD5 (esptool-js usa pra verificar integridade) -->
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
</body>
</html>
