name: build-littlefs

# Dispara quando algo em webApp/ muda. Bundla o webApp via esbuild+preact,
# gera a imagem LittleFS (mklittlefs binario do release oficial) e commita
# data/ + upload_littlefs/littlefs.bin de volta no main.
#
# Pushes do GITHUB_TOKEN nao retriggam workflows (politica do GitHub
# Actions), entao nao tem loop infinito.

on:
  push:
    branches: [main]
    paths:
      - 'webApp/**'
      - '.github/workflows/build-littlefs.yml'
  workflow_dispatch: {}  # permite rodar manual pelo botao da Actions

permissions:
  contents: write

# Forca as actions JS a rodarem no Node 24 (default ate jun/2026 ainda
# e Node 20, mas ja emite warning de deprecation). Remover depois que
# checkout@v5/setup-node@v5 sairem com Node 24 embutido.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Token com permissao de push (default GITHUB_TOKEN ja basta).
          token: ${{ secrets.GITHUB_TOKEN }}
          # Necessario pra permitir push de volta a partir do CI.
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build webApp
        working-directory: webApp
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Download mklittlefs
        run: |
          set -e
          # Releases do earlephilhower/mklittlefs tem o commit hash no nome
          # do asset (ex: x86_64-linux-gnu-mklittlefs-42acb97.tar.gz). Em vez
          # de fixar a URL e quebrar quando sair versao nova, perguntamos pra
          # API do GitHub qual e o asset Linux x86_64 do release "latest".
          ASSET_URL=$(curl -fsSL https://api.github.com/repos/earlephilhower/mklittlefs/releases/latest \
            | grep -oE '"browser_download_url":\s*"[^"]*x86_64-linux-gnu[^"]*\.tar\.gz"' \
            | head -n1 \
            | sed -E 's/.*"(https[^"]+)"/\1/')
          if [ -z "$ASSET_URL" ]; then
            echo "Nao achei asset linux x86_64 no release mais recente"
            exit 1
          fi
          echo "Baixando: $ASSET_URL"
          curl -fsSL -o mklittlefs.tar.gz "$ASSET_URL"
          tar -xzf mklittlefs.tar.gz
          rm mklittlefs.tar.gz
          # Extrai pra mklittlefs/mklittlefs (estrutura confirmada do release).
          BIN=$(find . -maxdepth 3 -type f -name 'mklittlefs' | head -n1)
          if [ -z "$BIN" ]; then
            echo "Binario mklittlefs nao encontrado no tarball"
            find . -maxdepth 3 -type f -print
            exit 1
          fi
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/mklittlefs
          mklittlefs --version 2>&1 | head -n3 || true

      - name: Generate littlefs.bin
        run: |
          mkdir -p upload_littlefs
          mklittlefs -c data -b 4096 -p 256 -s 0x180000 upload_littlefs/littlefs.bin
          ls -la upload_littlefs/littlefs.bin

      - name: Commit littlefs.bin
        run: |
          # So commitamos o litttlefs.bin. data/ continua gitignored
          # propositalmente (e regeravel localmente via `npm run build`).
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload_littlefs/littlefs.bin
          if git diff --staged --quiet; then
            echo "littlefs.bin nao mudou."
          else
            git commit -m "ci: rebuild littlefs.bin (webApp atualizado)"
            git push
          fi
