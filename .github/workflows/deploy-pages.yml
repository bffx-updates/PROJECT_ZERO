# Publica a pasta webApp/ no GitHub Pages a cada push pro main.
# Resulta em https://bffx-updates.github.io/PROJECT_ZERO/

name: Deploy webApp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload webApp/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./webApp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
